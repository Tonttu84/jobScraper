      # ========================================================================================
      # Boards picked from the ats-scrapers `jobhive` dataset (2026-09-09) and verified live
      # 2026-09-10 with `python scripts/probe_boards.py`. Full ranking, method and the ~1 300
      # boards that did not make the cut: docs/boards-ranked-2026-09-10.md.
      #
      # The per-board comment is `<tech postings in our target countries> tech / <of those,
      # non-senior> jr / <postings on the whole board worldwide>` from that dataset. Every board
      # over ~500 postings worldwide carries `include: *software_titles` so the listing is
      # narrowed before any description is fetched — without it a single one of these can take
      # longer than the whole rest of the run.
      #
