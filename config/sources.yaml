# Source settings. `enabled: false` skips a source; other keys are passed to the adapter as options.
# Run `jobscraper probe <source>` after moving to your own machine to verify each one works.

http:
  min_delay: 1.0          # seconds between requests to the same host
  timeout: 30
  # Headless-browser fallback for Cloudflare-protected sites (needs `uv sync --extra dev` and
  # `uv run playwright install chromium`). `auto`: a source may start Chromium when the plain
  # client is turned away — nothing is launched until one actually needs it. `never`: no browser,
  # such a source just fails with "needs a headless browser".
  browser: auto           # auto | never
  browser_timeout: 45     # seconds per page load
  browser_headless: true  # false to watch what the browser does while fixing a parser

sources:
  # ---------------------------------------------------------------- Finland / Estonia / Nordics
  duunitori:
    enabled: true
    queries: ["ohjelmistokehittäjä", "software developer", "junior developer", "harjoittelija ohjelmisto", "devops", "web developer", "full stack", "backend", "frontend", "C++", "python", "typescript", "react"]
    max_pages: 10
  tyomarkkinatori:
    enabled: true
    queries: ["software developer", "ohjelmistokehittäjä", "junior developer", "harjoittelija it", "web developer", "devops"]
    max_pages: 5
    fetch_details: true      # detail endpoint gives full description; rate-limited (403 after a few hundred)
    max_details: 150
  thehub:
    enabled: true
    countries: [FI, SE, "NO", DK]   # "NO" quoted: bare NO is YAML for false
  cvee:
    enabled: true
    keywords: ["developer", "software", "engineer", "junior", "intern"]
  cvkeskus:
    enabled: true
  jobly:
    # Verified live 2026-09-10 (5/5 postings parsed with title, company, city, date, description).
    # Needs Chromium (`uv run playwright install chromium`). The site is behind Cloudflare, so every
    # page goes through the headless browser (`mode: browser`); `auto` tries plain HTTP first,
    # `http` never starts a browser.
    enabled: true
    queries: ["software developer", "ohjelmistokehittäjä", "junior developer"]
    max_pages: 3
    max_details: 100
    mode: browser
  teamtailor:
    enabled: true
    # Teamtailor tenant slugs: https://<slug>.teamtailor.com/jobs.json . Add companies you care about.
    # Verified 2026-09-07: only these slugs answer jobs.json (the others 404 — most big
    # Finnish/Estonian companies use their own ATS). nordea answers but lists 0 jobs.
    tenants: [upcloud, siili, vismafinland, vincitoyj, huuva, huaweifinlandrnd, twoday, netum, qvik, evermade, monese, starship, mintos, nordea]
  ats_boards:
    enabled: true
    # Any careers URL supported by ats-scrapers (Greenhouse, Lever, Ashby, Workable, Personio,
    # SmartRecruiters, Recruitee, Breezy, …). It auto-detects the ATS from the URL.
    # Verified 2026-09-07 (the slugs guessed in the sandbox were mostly wrong):
    #   wolt, oura, veriff, wise -> Greenhouse; supercell -> Ashby; pipedrive -> Lever.
    #   aiven (aiven.io/careers) and bolt (bolt.eu) front a custom ATS and can't be resolved from a URL.
    #
    # A board entry is either a careers URL (above) or a mapping, for custom-domain
    # enterprise sites the URL can't identify (Oracle Recruiting Cloud, Eightfold on a custom domain, …):
    #   - ats: eightfold                  # ATS name, as ats-scrapers knows it
    #     slug: siemens                   # what that scraper's constructor wants (see its docstring)
    #     company: Siemens                # optional Job.company override
    #     options: {base_url: https://jobs.siemens.com, domain: siemens.com}   # optional scraper ctor kwargs
    #     include: 'engineer|intern'      # optional per-board title regex (case-insensitive)
    #     exclude: 'senior|manager'       # optional
    #     lazy_descriptions: auto         # true | false | auto (default)
    #     country: BE                     # optional ISO-2 fallback, for boards that hire in
    #                                     # one country only: it fills in the postings whose
    #                                     # own location string we cannot parse ("2 Locations",
    #                                     # a bare city), and never overrides a parsed country.
    #                                     # Quote it if it is a YAML keyword: country: "NO".
    #     countries: [FI, SE]             # optional list of ISO-2 codes this board is worth
    #                                     # fetching from — see below.
    # `url:` may be used instead of `ats`/`slug` when you want include/exclude/company on a
    # URL-resolved board. An unknown ATS name just fails that one board.
    #
    # Title filters run before conversion, so a filtered board never pays for the postings it
    # drops: when the scraper can fetch descriptions per posting (Workday, Oracle, …), the
    # listing is fetched without them and only the survivors are detailed. That is what keeps
    # a thousand-posting enterprise board usable. default_* apply to boards without their own.
    #
    # `countries:` is the second half of that: the worldwide boards (Microsoft, Ericsson,
    # JPMorgan, Hitachi, …) still leave hundreds of title survivors that sit in the US or in
    # India, and without it we pay for a description apiece before the rule filter drops them.
    # It runs after the title filter and before any per-posting fetch, and is deliberately
    # permissive: a posting is dropped only when we could read a country, that country is not
    # in the list, and the posting is not remote. Boards that hire in one country say
    # `country:` instead; source-level `default_countries:` (same shape) would cover every
    # board that names neither, and is left unset so a board in, say, Bucharest or Athens —
    # in the profile's tier-2 list but not in the anchor below — still reaches the rule filter.
    workers: 4                      # boards fetched at once; they are independent hosts, and
                                    # the client's per-host delay still applies (1 = sequential)
    default_include: 'engineer|developer|software|intern|trainee|graduate|working student|harjoittelija|kehittäjä'
    default_exclude: 'senior|lead|principal|staff|manager|director|head of|architect|vp\b'
    urls:
      - https://boards.greenhouse.io/wolt
      - https://boards.greenhouse.io/oura
      - https://boards.greenhouse.io/veriff
      - https://boards.greenhouse.io/wise
      - https://jobs.ashbyhq.com/supercell
      - https://jobs.lever.co/pipedrive
      # ---- Enterprise boards. Probed live 2026-09-10 (listed / after the default title filter):
      # Nokia 606/223, SAP 1011/260, Wärtsilä 139/41, Volvo 597/63, Bosch 4837/1359 (hence its own
      # include), Ubisoft 286/30, Spotify 78/4, Adyen 228/27, N26 66/19, Celonis 275/58,
      # Ericsson 529/194, Microsoft 2247/344.
      # Dropped: Delivery Hero (careers.deliveryhero.com runs on Attrax, which ats-scrapers has no
      # scraper for). Eightfold/Oracle/SmartRecruiters/Avature boards fetch descriptions lazily,
      # i.e. only for the title survivors, so the title filter is what bounds the scrape time.
      - ats: oracle                                   # Nokia: Oracle Recruiting Cloud
        slug: https://fa-evmr-saasfaprod1.fa.ocs.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1
        company: Nokia
        # Keep in sync with the location tiers in config/profile.yaml (tier1 + tier2 + tier3): a posting
        # outside this list is skipped before its description is fetched, so the list must not be
        # narrower than what the rule filter would keep.
        countries: &target_countries [FI, EE, AT, BE, BG, HR, CY, CZ, DK, FR, DE, GR, HU, IE, IT, LV, LT, LU, MT, NL,
                                      PL, PT, RO, SK, SI, ES, SE, "NO", IS, CH, LI,
                                      AE, GE, AZ, AM, BA, RS, ME, MK, AL, MD, UA, KZ, UZ, KG, TR]  # tier3 minus XK (Kosovo has no ISO-2 code)
      # Siemens (jobs.siemens.com, Avature): NOT usable. The tenant serves 6 postings per page whatever
      # jobRecordsPerPage asks for, and ats-scrapers stops paging at the first short page, so
      # `{ats: avature, slug: https://jobs.siemens.com/en_US/externaljobs}` returns 6 of 999+ jobs.
      - ats: successfactors                           # SAP: SuccessFactors recruiting-marketing site
        slug: https://jobs.sap.com
        company: SAP
        countries: *target_countries
      - ats: successfactors                           # Wärtsilä (Helsinki/Vaasa): SuccessFactors
        slug: https://careers.wartsila.com
        company: Wärtsilä
        country: FI
      - ats: successfactors                           # Volvo Group (Gothenburg): SuccessFactors
        slug: https://jobs.volvogroup.com
        company: Volvo Group
        countries: *target_countries
      - url: https://jobs.smartrecruiters.com/BoschGroup   # Bosch: SmartRecruiters, ~5 000 postings, most of them
        include: 'software|developer|entwickler|firmware|embedded|programm|intern|trainee|graduate|working student|werkstudent'
        countries: *target_countries
      - url: https://jobs.smartrecruiters.com/Ubisoft2   # Ubisoft incl. RedLynx Helsinki: SmartRecruiters
        company: Ubisoft
        countries: *target_countries
      - https://jobs.lever.co/spotify                 # Spotify (Stockholm): Lever
      - https://boards.greenhouse.io/adyen            # Adyen (Amsterdam): Greenhouse
      - https://boards.greenhouse.io/n26              # N26 (Berlin): Greenhouse
      - https://boards.greenhouse.io/celonis          # Celonis (Munich): Greenhouse
      - ats: eightfold                                # Ericsson: Eightfold on a custom domain
        slug: ericsson
        company: Ericsson
        countries: *target_countries
        options: {base_url: https://jobs.ericsson.com, domain: ericsson.com}
      - ats: eightfold                                # Microsoft: Eightfold since 2026 (replaces the old `microsoft` adapter)
        slug: microsoft
        company: Microsoft
        countries: *target_countries
        options: {base_url: https://apply.careers.microsoft.com, domain: microsoft.com}
      # Big-tech sites with their own scrapers in ats-scrapers (`ats: amazon|google|apple|meta|uber|tesla`,
      # slug is ignored). They list 10 000+ jobs worldwide and most do not support per-posting
      # description fetches, so a probe first; enable one at a time:
      #   - {ats: google, slug: google, company: Google}
      #   - {ats: apple, slug: apple, company: Apple}
      # The dataset ranks Google 204 / TikTok 110 / Amazon 64 / Tesla 53 tech postings in our
      # countries, so they are worth the probe — but not before someone has watched one run.
