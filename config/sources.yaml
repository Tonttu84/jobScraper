# Source settings. `enabled: false` skips a source; other keys are passed to the adapter as options.
# Run `jobscraper probe <source>` after moving to your own machine to verify each one works.

http:
  min_delay: 1.0          # seconds between requests to the same host
  timeout: 30
  # Headless-browser fallback for Cloudflare-protected sites (needs `uv sync --extra dev` and
  # `uv run playwright install chromium`). `auto`: a source may start Chromium when the plain
  # client is turned away — nothing is launched until one actually needs it. `never`: no browser,
  # such a source just fails with "needs a headless browser".
  browser: auto           # auto | never
  browser_timeout: 45     # seconds per page load
  browser_headless: true  # false to watch what the browser does while fixing a parser

sources:
  # ---------------------------------------------------------------- Finland / Estonia / Nordics
  duunitori:
    enabled: true
    queries: ["ohjelmistokehittäjä", "software developer", "junior developer", "harjoittelija ohjelmisto", "devops", "web developer", "full stack", "backend", "frontend", "C++", "python", "typescript", "react"]
    max_pages: 10
  tyomarkkinatori:
    enabled: true
    queries: ["software developer", "ohjelmistokehittäjä", "junior developer", "harjoittelija it", "web developer", "devops"]
    max_pages: 5
    fetch_details: true      # detail endpoint gives full description; rate-limited (403 after a few hundred)
    max_details: 150
  thehub:
    enabled: true
    countries: [FI, SE, "NO", DK]   # "NO" quoted: bare NO is YAML for false
  cvee:
    enabled: true
    keywords: ["developer", "software", "engineer", "junior", "intern"]
  cvkeskus:
    enabled: true
  jobly:
    # Disabled until it is checked live: verify with `jobscraper probe jobly` first; needs Chromium
    # (`uv run playwright install chromium`). The site is behind Cloudflare, so every page goes
    # through the headless browser (`mode: browser`); `auto` tries plain HTTP first, `http` never
    # starts a browser. The adapter was written without access to the site — expect selector fixes.
    enabled: false
    queries: ["software developer", "ohjelmistokehittäjä", "junior developer"]
    max_pages: 3
    max_details: 100
    mode: browser
  teamtailor:
    enabled: true
    # Teamtailor tenant slugs: https://<slug>.teamtailor.com/jobs.json . Add companies you care about.
    # Verified 2026-09-07: only these slugs answer jobs.json (the others 404 — most big
    # Finnish/Estonian companies use their own ATS). nordea answers but lists 0 jobs.
    tenants: [upcloud, siili, vismafinland, vincitoyj, huuva, huaweifinlandrnd, twoday, netum, qvik, evermade, monese, starship, mintos, nordea]
  ats_boards:
    enabled: true
    # Any careers URL supported by ats-scrapers (Greenhouse, Lever, Ashby, Workable, Personio,
    # SmartRecruiters, Recruitee, Breezy, …). It auto-detects the ATS from the URL.
    # Verified 2026-09-07 (the slugs guessed in the sandbox were mostly wrong):
    #   wolt, oura, veriff, wise -> Greenhouse; supercell -> Ashby; pipedrive -> Lever.
    #   aiven (aiven.io/careers) and bolt (bolt.eu) front a custom ATS and can't be resolved from a URL.
    urls:
      - https://boards.greenhouse.io/wolt
      - https://boards.greenhouse.io/oura
      - https://boards.greenhouse.io/veriff
      - https://boards.greenhouse.io/wise
      - https://jobs.ashbyhq.com/supercell
      - https://jobs.lever.co/pipedrive
  linkedin:
    enabled: true
    queries: ["junior software developer", "junior developer", "software developer intern", "graduate software engineer", "trainee developer"]
    locations: ["Finland", "Estonia", "Sweden", "Norway", "Denmark", "Germany", "Netherlands", "Berlin", "Dubai", "European Union"]
    results_per_query: 40
    hours_old: 168
  indeed:
    enabled: true
    queries: ["junior software developer", "junior developer", "software developer intern", "trainee developer"]
    countries: [finland, estonia, sweden, norway, germany, netherlands, "united arab emirates"]
    results_per_query: 40
    hours_old: 168

  # ---------------------------------------------------------------- Central / Western Europe
  nofluffjobs:
    enabled: true
    regions: [pl, en, nl, hu, cz, sk]
    seniority: [trainee, junior]
    max_pages: 10
  justjoin:
    enabled: true
    experience_levels: [junior]
    max_pages: 20
  arbeitnow:
    enabled: true
    max_pages: 8
  devitjobs:
    enabled: true
    sites: [germantechjobs.de, swissdevjobs.ch, devitjobs.nl, devitjobs.uk]
    remote_only_sites: [devitjobs.uk]   # UK jobs are only interesting when they are remote
  wttj:
    enabled: true
    query: "junior developer"
    countries: [FI, EE, SE, "NO", DK, DE, NL, BE, AT, CH, FR, ES, PT, IT, IE, PL, CZ, AE]   # "NO" quoted: bare NO is YAML for false
    include_remote: true
  landingjobs:
    enabled: true
    max_pages: 10
  eures:
    enabled: false          # huge; enable with a small query if you want the EU-wide public feed
    query: "junior software developer"
    countries: [fi, ee, de, nl, se, "no", dk]   # "no" quoted: bare no is YAML for false

  # ---------------------------------------------------------------- Remote boards
  remotive:
    enabled: true
  jobicy:
    enabled: true
  himalayas:
    enabled: true
    max_pages: 10
  remoteok:
    enabled: true
  weworkremotely:
    # Disabled 2026-09-08 (owner): the site makes job seekers buy a 12-month subscription to apply,
    # which no legitimate board does — they charge the hiring companies, not the applicants.
    enabled: false

  # ---------------------------------------------------------------- Dubai
  bayt:
    # Disabled 2026-09-07: bayt.com answers HTTP 403 (bot challenge) to every request from a
    # plain HTTP client, even after the cookie handshake. Needs a headless browser; not worth it.
    enabled: false
    queries: ["junior developer", "software developer", "software engineer intern"]
    max_pages: 3
