[project]
name = "jobscraper"
version = "0.1.0"
description = "Scrape junior software jobs across the EU/Nordics/remote, auto-filter them, and rank with Claude."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "lingua-language-detector>=2.0",
    "anthropic>=1.0",
    "ats-scrapers[scrapers]>=0.3.0",
    "python-jobspy",
    "feedparser>=6",
    "pandas>=2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "playwright>=1.45"]

[project.scripts]
jobscraper = "jobscraper.cli:app"

[tool.uv.sources]
python-jobspy = { git = "https://github.com/speedyapply/JobSpy" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobscraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=jobscraper --cov-report=term-missing:skip-covered"

[tool.coverage.run]
source = ["src/jobscraper"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set so results don't change with ruff's defaults.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM108", "B905", "B008"]  # B008: typer.Argument defaults are idiomatic
