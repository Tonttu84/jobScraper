[project]
name = "jobscraper"
version = "0.1.0"
description = "Scrape junior software jobs across the EU/Nordics/remote, auto-filter them, and rank with Claude."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.14.3",
    "pyyaml>=6",
    "typer>=0.28.0",
    "rich>=13",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "lingua-language-detector>=2.0",
    "anthropic>=1.0",
    "ats-scrapers[scrapers]>=0.3.0",
    "python-jobspy",
    "feedparser>=6",
    "pandas>=2",
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "pytest-cov>=5", "pytest-xdist>=3", "ruff>=0.17.4", "playwright>=1.64.1"]

[project.scripts]
jobscraper = "jobscraper.cli:app"

[tool.uv.sources]
python-jobspy = { git = "https://github.com/speedyapply/JobSpy" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobscraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=jobscraper --cov-report=term-missing:skip-covered"

[tool.coverage.run]
source = ["src/jobscraper"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set so results don't change with ruff's defaults.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM108", "B905", "B008"]  # B008: typer.Argument defaults are idiomatic
# Function limits (docs/decisions.md D4): a report for now, not a gate. Ruff has no warning
# level, so run them with --exit-zero (AGENTS.md → Commands); uncomment to make them fail the gate.
# extend-select = ["C901", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 15          # C901, cyclomatic

[tool.ruff.lint.pylint]
max-args = 5                 # PLR0913
max-branches = 12            # PLR0912
max-statements = 50          # PLR0915, Ruff's stand-in for function length
