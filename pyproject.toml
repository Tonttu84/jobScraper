[project]
name = "jobscraper"
version = "0.1.0"
description = "Scrape junior software jobs across the EU/Nordics/remote, auto-filter them, and rank with Claude."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "lingua-language-detector>=2.0",
    "anthropic>=1.0",
    "ats-scrapers[scrapers]>=0.3.0",
    "python-jobspy",
    "feedparser>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.30", "ruff>=0.5"]

[project.scripts]
jobscraper = "jobscraper.cli:app"

[tool.uv.sources]
python-jobspy = { git = "https://github.com/speedyapply/JobSpy" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobscraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
