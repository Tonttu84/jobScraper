# Scheduled pipeline run on a SELF-HOSTED runner.
#
# DISABLED until a self-hosted runner is registered for this repository and the repository
# variable SCHEDULED_RUNS is set to 'true' (Settings → Secrets and variables → Actions →
# Variables). Without the variable every run exits immediately, so the workflow is safe to
# merge as it is.
#
# It must not run on GitHub-hosted runners: several job boards block cloud IP ranges (which is
# exactly why the adapters are fixture-tested here), and the Anthropic API key should stay on
# the owner's machine rather than in a cloud runner's environment.
name: scheduled-run

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC, daily

permissions:
  contents: read

jobs:
  run:
    if: vars.SCHEDULED_RUNS == 'true'
    runs-on: self-hosted
    # The scrape alone took 62 minutes on 2026-10-12 (docs/PLAN.md); the AI stages come on top.
    timeout-minutes: 240
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      JOBSCRAPER_PROFILE: ${{ vars.JOBSCRAPER_PROFILE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: uv sync --extra dev

      # config/profile.yaml (the CV) is not in this repository; the runner's machine keeps a
      # clone of the private repo and this copies the config back in (see scripts/sync_private.sh).
      - name: Restore the private config
        env:
          JOBSCRAPER_PRIVATE_DIR: ${{ vars.JOBSCRAPER_PRIVATE_DIR }}
        run: ./scripts/sync_private.sh restore

      - name: Run the pipeline and diff it against the previous report
        run: ./scripts/scheduled_run.sh

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results
          path: results/
          if-no-files-found: warn

      - name: Show the newest diff in the job summary
        if: always()
        run: |
          newest=$(ls -1t results/diff-*.md results/*/diff-*.md 2>/dev/null | head -n 1 || true)
          if [ -n "$newest" ]; then
            echo "## What's new ($newest)" >> "$GITHUB_STEP_SUMMARY"
            cat "$newest" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No diff file was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
