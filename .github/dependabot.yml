# Dependabot version updates (from Tonttu84/ai-workflow's template): one grouped pull request
# per ecosystem on the 1st and 15th of each month (UTC), as Dependabot has no two-week interval.
# The `chore` and `ci` prefixes make every title a valid subject for the commit hook and the CI
# commit check. Workflows pin actions by commit SHA with the release tag in a trailing comment,
# and only Dependabot moves them. Security updates are a repository setting (on).
# Groups apply to version updates unless they say otherwise, so each ecosystem also has a
# short-named group for its security updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 6 1,15 * *'
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - '*'
      gha-sec:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: cron
      cronjob: '0 6 1,15 * *'
    groups:
      uv:
        applies-to: version-updates
        patterns:
          - '*'
      uv-sec:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: chore
    ignore:
      # python-jobspy (LinkedIn/Indeed) requires pandas>=2.1,<3, so a pandas 3 bump cannot
      # resolve and fails the whole uv job (dependency_file_not_resolvable). Drop this once
      # python-jobspy allows pandas 3.
      - dependency-name: pandas
        update-types: ['version-update:semver-major']
